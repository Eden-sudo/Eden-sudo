<style>
  .bg { fill: #f8fafc; stroke: #d0d7de; }
  .name { fill: #0f172a; font: 700 40px 'Segoe UI', Helvetica, Arial, sans-serif; }
  .role { fill: #0f766e; font: 600 18px 'Segoe UI', Helvetica, Arial, sans-serif; }
